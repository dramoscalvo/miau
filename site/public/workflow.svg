    <text x="28" y="540" fill="#ebf68b">a</text><text x="49" y="540" fill="#eee8f4">approve</text><text x="177" y="540" fill="#ebf68b">e</text><text x="198" y="540" fill="#eee8f4">edit</text><text x="300" y="540" fill="#ebf68b">d</text><text x="321" y="540" fill="#eee8f4">discuss</text><text x="453" y="540" fill="#ebf68b">p</text><text x="474" y="540" fill="#eee8f4">revise</text>
    <text x="28" y="577" fill="#b6aec5" font-size="13">One agent at a time. One human at every decision gate.</text>
